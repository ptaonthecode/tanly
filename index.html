<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng 20/10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to right bottom, #fde6e6, #fff0f5); /* Light pink gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            padding-bottom: 20px; /* Space for the signature */
        }
        .card-header {
            background: linear-gradient(to right, #ff8c94, #ffb3ba); /* Stronger pink */
            color: white;
            padding: 20px 0;
            font-family: 'Dancing Script', cursive;
        }
        .card-header h1 {
            font-size: 3rem;
            margin: 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        .card-body {
            padding: 25px;
            font-size: 1.1rem;
            color: #333;
            line-height: 1.6;
        }
        .card-body p {
            margin-bottom: 5px;
        }
        .poem p {
             margin-bottom: 5px;
        }
        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #d6336c; /* Deep rose */
            margin-top: 20px;
            text-align: right;
            padding-right: 25px;
        }
        .flower-image {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            border-bottom: 5px solid #ffb3ba; /* Pink border */
        }
        /* Optional: Add a subtle animation for flair */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card {
            animation: fadeIn 1s ease-out;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h1>Gửi Lý thương mến!</h1>
        </div>
        
        <img src="IMG_1666.JPG" alt="Bó hoa cẩm chướng hồng và baby xanh" class="flower-image">

        <div class="card-body">
            <p>Nhân ngày 20/10, anh xin gửi tới em những lời chúc tốt đẹp và ngọt ngào nhất.</p>
            <div class="poem" style="font-style: italic; margin: 25px 0; color: #4a4a4a;">
                <p>Hai mươi tháng Mười, mến trao,</p>
                <p>Đóa hoa xinh tựa lời chào ngọt ngào.</p>
                <p>Chúc Lý luôn đẹp, thanh tao,</p>
                <p>Nụ cười hạnh phúc, dạt dào niềm vui.</p>
            </div>
            <p>Hãy luôn rạng rỡ và yêu đời như đóa hoa này em nhé!</p>
        </div>
        <div class="signature">
            apt.ndy
        </div>
    </div>
</body>
</html>
